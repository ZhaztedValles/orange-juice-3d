title: "The King and Queen Ate Breakfast Above a Fire. On Purpose."
description: |
  In the 1770s the MP David Hartley built a fire-proof house on Putney Heath, near London, and set fires on its floors while the Lord Mayor, and reportedly King George III and Queen Charlotte at breakfast, sat in the room above. His secret was thin iron plates under the floorboards. Nine years later, the treaty that ended the American war was signed in his rooms in Paris.
  Sources: https://www.british-history.ac.uk/old-new-london/vol6/pp489-503 https://en.wikipedia.org/wiki/David_Hartley_(the_Younger) https://www.archives.gov/milestone-documents/treaty-of-paris
