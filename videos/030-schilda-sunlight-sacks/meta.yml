title: "The Legend of the Town That Forgot Its Windows"
description: |
  Legend says the clever folk of Schilda chose to act foolish on purpose, then built a town hall with no windows and tried to carry the sunshine inside in sacks. A German folk tale first printed in 1597.
  Sources: https://projekt-gutenberg.org/authors/anonyme-oder-unbekannte-autoren/books/die-schildbuerger/chapter/12 https://elfinspell.com/WitandHumor/12German/TheSchildburghers.html https://en.wikipedia.org/wiki/Schildb%C3%BCrger
