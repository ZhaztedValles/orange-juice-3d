title: "This Village Had to Bury Its Giant Pie"
description: |
  In August 1887 the Yorkshire village of Denby Dale baked a giant pie of about a ton and a half for Queen Victoria's Golden Jubilee. At the first cut it stank of rotten meat, so it was buried in quicklime. That September they baked a new one: the Resurrection Pie.
  Sources: https://en.wikipedia.org/wiki/Denby_Dale https://www.yorkshirepost.co.uk/heritage-and-retro/heritage/how-denby-dale-invented-the-giant-meat-pie-3012776 https://foodsofengland.info/denbydalepie.html
