title: "She Flew Over Paris Before the Wright Brothers. Her Parents Hid It for Decades"
description: |
  In June 1903, nineteen-year-old Aida de Acosta flew Alberto Santos-Dumont's little airship alone over Paris and landed in the middle of a polo match, the first woman to pilot a powered aircraft. Her parents made sure nobody heard about it for about thirty years.
  Sources: https://en.wikipedia.org/wiki/Aida_de_Acosta https://theappendix.net/issues/2014/4/the-aviators-heart https://medium.com/faa/aida-de-acosta-americas-first-pilot-3ae7a88d055f
