title: "How a Sheet of Glass Put a Real-Looking Ghost on a London Stage in 1862"
description: |
  On Christmas Eve 1862 a ghost drifted across the stage of the Royal Polytechnic in London. The trick was a hidden, brightly lit actor and one huge tilted sheet of glass, an idea first worked out by the engineer Henry Dircks, though it took John Henry Pepper's name.
  Sources: https://www.scientificamerican.com/article/how-ghostbusting-became-a-victorian-pastime/ https://www.lindahall.org/about/news/scientist-of-the-day/john-henry-pepper/
