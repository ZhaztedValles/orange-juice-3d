title: "This 1583 Shipwreck Padlock Stayed Locked for 400 Years. A Scanner Just Cracked Its Code"
description: |
  A brass combination lock from the Ann Francis, wrecked on a Welsh beach in 1583, had beaten everyone for twenty years. This month Museum Wales and Cardiff University read its four-letter code with micro-CT scans, and it opened without a scratch. Nobody knows what the code meant. What do you think?
  Sources: https://www.smithsonianmag.com/smart-news/this-mysterious-combination-lock-sank-in-a-1583-shipwreck-when-engineers-cracked-the-code-it-clicked-open-for-the-first-time-in-more-than-400-years-180989864/ https://www.jpost.com/archaeology/article-914060
