title: "The Pearl Necklace That Came Home in the Post as Lumps of Sugar"
description: |
  In July 1913 a London pearl dealer opened a sealed parcel that should have held the finest pearl necklace in the world, and found only sugar. This is how Scotland Yard tracked the thieves, and how the pearls turned up in a matchbox in a gutter.
  Sources: https://en.wikipedia.org/wiki/Great_Pearl_Robbery https://www.lloyds.com/about-lloyds/history/catastrophes-and-claims/great-pearl-robbery
