title: "The Letters That Rolled Along the Bottom of the Seine Into Besieged Paris"
description: |
  In January 1871, with Paris surrounded, letters were sealed inside finned zinc balls and dropped into the Seine far upstream, to roll along the riverbed into a net in the city. The ice had other ideas, and the balls kept turning up for more than a century.
  Sources: https://en.wikipedia.org/wiki/Moulins_Ball https://pop.culture.gouv.fr/notice/joconde/11160107815
