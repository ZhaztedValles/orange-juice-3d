title: "What If Egypt Had Said Yes? The Statue of Liberty Was Almost a Lighthouse on the Suez Canal"
description: |
  In the late 1860s the sculptor Auguste Bartholdi drew a giant robed Egyptian woman with a torch to guard the Suez Canal at Port Said. The Khedive said no. Here is what really happened, and what might have happened if he had said yes. The "what if" part is imagined.
  Sources: https://en.wikipedia.org/wiki/Egypt_Carrying_the_Light_to_Asia https://www.nps.gov/stli/learn/historyculture/fr%C3%A9d%C3%A9ric-auguste-bartholdi.htm https://archive.aramcoworld.com/issue/198605/the.new.colossus.htm
