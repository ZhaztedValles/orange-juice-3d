title: "America's First Car Race Was Won at 5 mph, and Second Place Was Driven In by the Umpire"
description: |
  On Thanksgiving Day 1895 six cars started America's first car race, through fresh snow from Chicago to Evanston and back. Only two finished, and the second came in with its frozen driver held up by the umpire at the wheel.
  Sources: https://en.wikipedia.org/wiki/Chicago_Times-Herald_race https://www.saturdayeveningpost.com/2015/11/the-first-auto-race-thanksgiving-1895/
