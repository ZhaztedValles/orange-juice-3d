title: "In 1746 a Priest Made 200 Monks Jump at Exactly the Same Moment"
description: |
  In 1746 the Abbé Nollet wired about two hundred monks into a ring a mile around and sent one electric shock through them all, to find out how fast electricity travels.
  Sources: https://en.wikipedia.org/wiki/Jean-Antoine_Nollet https://ietarchivesblog.org/2017/11/07/abbe-jean-antoine-nollet-1700-1770-vs-benjamin-franklin-1706-1790/
