title: "In 1853, Twenty-One Men Ate Dinner Inside a Dinosaur. It Was Wrong."
description: |
  On New Year's Eve 1853 the sculptor Benjamin Waterhouse Hawkins served an eight-course dinner inside the mould of his Iguanodon for the Crystal Palace park. The model had one big mistake.
