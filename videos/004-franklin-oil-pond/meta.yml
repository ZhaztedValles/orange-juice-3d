title: "Benjamin Franklin Flattened a Windy Pond With One Teaspoon of Oil"
description: |
  On a gusty day at Clapham Common, Franklin tipped barely a teaspoon of oil onto a pond and half an acre of ripples went smooth as glass. A century later the same trick measured a molecule.
  Sources: https://founders.archives.gov/documents/Franklin/01-20-02-0250 https://physicstoday.aip.org/features/oil-on-troubled-waters-benjamin-franklin-and-the-honor-of-dutch-seamen https://press.asimov.com/articles/measure-molecules
