title: "A Horse Entered a Steam Engine Race in 1829"
description: |
  At the Rainhill locomotive trials of October 1829, four steam engines faced the Cycloped: a wagon driven by a horse walking on a treadmill inside it. It managed about six miles an hour, until the horse went through the floor. The Rocket won.
  Sources: https://collection.sciencemuseumgroup.org.uk/objects/co26811/model-of-brandreths-cycloped-model-cycloped https://www.lindahall.org/about/news/scientist-of-the-day/rainhill-trials/ https://en.wikipedia.org/wiki/Rainhill_trials
