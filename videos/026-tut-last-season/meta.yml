title: "What If Lord Carnarvon Had Said No? Tutankhamun's Tomb Was Found in the Very Last Season He Paid For"
description: |
  In 1922 Lord Carnarvon was ready to stop paying Howard Carter to dig in the Valley of the Kings. He gave him one more season, and that November Carter's men found a step under old workmen's huts that led to the tomb of Tutankhamun. Here is what really happened, and what might have happened if he had said no. The "what if" part is imagined.
  Sources: https://tutankhamun.griffith.ox.ac.uk/seasons/1st-season-1922-1923 https://www.nationalgeographic.com/history/history-magazine/article/findingkingtutstomb
