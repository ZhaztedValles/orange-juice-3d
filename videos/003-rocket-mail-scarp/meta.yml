title: "The Rocket That Mailed Letters Straight Into the Sand"
description: |
  In 1934 a German inventor tried to rocket over a thousand letters to a remote Scottish island's neighbour, and the rocket burst, scattering scorched mail across the beach.
  Sources: https://cabinetmagazine.org/issues/23/turner2.php https://www.smithsonianmag.com/daily-planet/department-of-what-were-they-thinking-25283814
