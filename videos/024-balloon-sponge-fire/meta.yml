title: "The Last 25 Minutes of the First Flight Ever: Two Men Fighting Fire on Their Own Balloon"
description: |
  On 21 November 1783 two men made the first free flight by people, over Paris, in a paper balloon kept up by a straw fire. They spent the whole flight stoking the fire and dabbing out burning holes with wet sponges.
  Sources: https://www.lindahall.org/about/news/scientist-of-the-day/francois-laurent-darlandes/ https://www.guinnessworldrecords.com/news/2026/7/how-did-burning-shoes-and-flying-sheep-lead-to-the-first-hot-air-balloon https://en.wikipedia.org/wiki/Fran%C3%A7ois_Laurent_d%27Arlandes
