title: "In 1862 a Balloon Pilot Saved Two Lives by Pulling a Rope With His Teeth, Five Miles Up"
description: |
  In September 1862 James Glaisher and Henry Coxwell rose five miles above England in a gas balloon. Glaisher passed out in the thin air, and Coxwell, his hands useless, opened the valve with his teeth.
  Sources: https://www.metoffice.gov.uk/research/library-and-archive/archive-hidden-treasures/james-glaisher https://www.lindahall.org/about/news/scientist-of-the-day/henry-coxwell
