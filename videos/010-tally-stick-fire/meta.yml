title: "In 1834 Two Workmen Burned Down Parliament by Throwing Out Old Receipts"
description: |
  On 16 October 1834 two labourers spent the day burning cartloads of old wooden tally sticks, the treasury's medieval receipts, in the furnaces under the House of Lords. That evening the old Palace of Westminster burned down.
  Sources: https://historyofparliament.com/2013/10/16/the-fire-of-1834/ https://en.wikipedia.org/wiki/Burning_of_Parliament
tags: [history, london, parliament, fire, westminster, victorian, tally sticks]
