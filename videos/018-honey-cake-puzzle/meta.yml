title: "Puzzle: Someone Stole a Prize Bake During the Boat Race. Can You Solve It?"
description: |
  An invented whodunit. While the whole town cheered the boat race, one of Mrs Plum's three prize bakes vanished from her window. Three suspects, one slip. Who did it? Tell us in the comments.




  Answer: Felix the clockmaker. Constable Pike told nobody which of the three bakes was missing, yet Felix said he didn't even like honey cake. Only the thief could know it was the honey cake. (And the bee buzzing round him was a bonus clue.)
