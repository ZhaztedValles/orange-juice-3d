title: "Voyager 1 Reached One Light-Day From Earth While Sending Empty Signals"
description: |
  On 18 November 2026 NASA's Voyager 1, launched in 1977, became the first human-made object one light-day from Earth, about 16 billion miles away. Since 14 November the Deep Space Network had been hearing only its carrier signal, with no data inside, and every message now takes a full day each way. NASA celebrated the milestone a day late, once the signal had arrived.
  Sources: https://edition.cnn.com/2026/11/24/science/voyager-1-nasa-communication-breakdown-data-glitch https://www.scientificamerican.com/article/voyager-1-reaches-one-light-day-milestone/ https://www.upi.com/Odd_News/2026/11/18/voyager-1-one-light-day-from-earth/5931795019381/ https://science.nasa.gov/blogs/voyager/2026/11/18/voyager-1-engineers-analyze-data-issue-ready-to-confirm-light-day/
