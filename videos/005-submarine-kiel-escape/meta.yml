title: "Trapped in a Sunken Submarine in 1851, Their Way Out Was to Let the Sea In"
description: |
  In Kiel harbour in 1851, Wilhelm Bauer's iron submarine sank sixteen metres with three men inside. To open the hatch, he had to let it flood.
  Sources: https://www.dhmjournal.com/images/IndividArticles/29June/Elliot_SPUMSJ.29.2.81-87.pdf https://en.wikipedia.org/wiki/Brandtaucher
