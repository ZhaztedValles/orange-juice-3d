title: "In 1798 a Count Boiled Water With No Fire, Using Two Horses and a Cannon"
description: |
  At the Munich arsenal in 1798 Count Rumford ground a blunt drill into a brass cannon casting sunk in cold water, and after two and a half hours the water boiled with no fire at all.
  Sources: https://royalsocietypublishing.org/doi/10.1098/rstl.1798.0006 https://en.wikipedia.org/wiki/An_Inquiry_Concerning_the_Source_of_the_Heat_Which_Is_Excited_by_Friction
