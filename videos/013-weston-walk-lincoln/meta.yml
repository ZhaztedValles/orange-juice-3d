title: "He Lost a Bet on Lincoln, So He Walked 478 Miles to Washington"
description: |
  In 1860 Edward Payson Weston bet that Abraham Lincoln would lose the election. Lincoln won, so Weston walked from Boston to Washington through snow and mud, and arrived a few hours too late.
  Sources: https://boundarystones.weta.org/2025/06/24/edward-payson-weston-most-famous-athlete-youve-never-heard https://en.wikipedia.org/wiki/Edward_Payson_Weston https://transportationhistory.org/2021/02/22/edward-payson-weston-travels-by-foot-from-boston-to-washington-d-c
