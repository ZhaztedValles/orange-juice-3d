title: "In 1872 Nearly Every Horse Caught the Flu, So People Pulled the Streetcars Themselves"
description: |
  In the autumn of 1872 a horse flu swept North America. In New York people hauled streetcars by hand, and in Boston the first fire engine to reach a great fire was pulled by men.
  Sources: https://www.smithsonianmag.com/history/how-horse-flu-epidemic-brought-19th-century-america-stop-180976453/ https://daily.jstor.org/civilization-without-horses-the-epizootic-of-1872/
