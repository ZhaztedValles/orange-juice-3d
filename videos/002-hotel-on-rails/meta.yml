title: "The Hotel That Escaped the Ocean on Rails"
description: |
  In 1888 a grand Coney Island hotel, about four thousand tons of it, was jacked onto flatcars and hauled inland by six locomotives to dodge the eroding shore.
  Sources: https://americanheritage.com/1888-one-hundred-years-ago-1 https://www.bklynlibrary.org/blog/2019/04/10/brighton-beach-hotel-1888
