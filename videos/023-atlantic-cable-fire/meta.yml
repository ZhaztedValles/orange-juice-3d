title: "New York Burned Its Own City Hall Celebrating a Wire Under the Atlantic"
description: |
  In August 1858 the first telegraph cable across the Atlantic carried a message from Queen Victoria to the President. New York's fireworks set City Hall's dome on fire, and within a few weeks the cable was dead.
