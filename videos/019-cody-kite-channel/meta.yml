title: "In 1903 a Cowboy Crossed the English Channel in a Boat Pulled by a Kite"
description: |
  In November 1903 the showman Samuel Franklin Cody sailed from Calais to Dover overnight in a tiny folding boat with no sail, no oars and no engine, towed only by one of his man-lifting kites.
  Sources: https://sfcody.org.uk/2024/06/14/s-f-cody-kites/ https://en.wikipedia.org/wiki/Samuel_Franklin_Cody https://dovermuseum.co.uk/Information-Resources/HPAC-Biographical/Channel-Crossing-Biography.aspx
