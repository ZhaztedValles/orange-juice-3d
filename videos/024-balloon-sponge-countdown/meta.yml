title: "The Last 25 Minutes of the First Flight: Two Men Putting Out Fires Over Paris"
description: |
  On 21 November 1783 the first two people ever to fly free spent their twenty-five minutes over Paris dabbing out fires in their own balloon with a wet sponge. A countdown of the first flight in history.
  Sources: https://www.lindahall.org/about/news/scientist-of-the-day/francois-laurent-darlandes/ https://collection.sciencemuseumgroup.org.uk/objects/co29133/model-of-montgolfier-balloon-used-in-first-demonstration-to-carry-human-passengers-in-free-flight https://en.wikipedia.org/wiki/Jean-Fran%C3%A7ois_Pil%C3%A2tre_de_Rozier
