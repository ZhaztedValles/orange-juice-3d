title: "In 1872 Two Cousins Sold America's Richest Bankers a Diamond Field They Sprinkled by Hand"
description: |
  In 1872 Philip Arnold and John Slack salted a lonely mesa out west with cheap rough stones, fooled Tiffany, a mining engineer and San Francisco's biggest bankers, until the geologist Clarence King found rubies planted in anthills.
  Sources: https://www.smithsonianmag.com/history/the-great-diamond-hoax-of-1872-2630188/ https://www.wyohistory.org/encyclopedia/diamond-hoax-bonanza-never-was
