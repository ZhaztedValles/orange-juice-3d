name: spike-split

# Split rendering spike: a matrix of runners each renders one frame range of BridgeShort, then a join job
# concatenates the pieces losslessly (ffmpeg concat demuxer, -c copy) and checks the seams.
on:
  workflow_dispatch:
    inputs:
      frames_total:
        description: "Frames to render, starting at 0"
        default: "1800"
        required: true
      chunks:
        description: "Number of parallel chunks"
        default: "10"
        required: true
      res:
        description: "Output height: 1920 (1080x1920) or 1280 (720x1280)"
        default: "1920"
        required: true
      gl:
        description: "Chromium GL backend (swangle is the one that works on ubuntu runners)"
        default: "swangle"
        required: true
      concurrency:
        description: "Remotion --concurrency per chunk (empty = Remotion default)"
        default: ""
        required: false

permissions:
  contents: read
  actions: read

env:
  GL: ${{ inputs.gl }}
  RES: ${{ inputs.res }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          total=${{ inputs.frames_total }}; n=${{ inputs.chunks }}
          python3 - "$total" "$n" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          total, n = int(sys.argv[1]), int(sys.argv[2])
          cuts = [round(i * total / n) for i in range(n + 1)]
          inc = [{"idx": f"{i:03d}", "from": cuts[i], "to": cuts[i + 1] - 1} for i in range(n) if cuts[i + 1] > cuts[i]]
          print("matrix=" + json.dumps({"include": inc}))
          EOF
          cat "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      TMPDIR: ${{ github.workspace }}/../remotion-tmp
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # node_modules includes Remotion's downloaded headless shell (node_modules/.remotion), so one cache covers both
      - name: Cache node_modules + Remotion browser
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci && npx remotion browser ensure

      - name: Cache Kenney models
        uses: actions/cache@v4
        with:
          path: public/bridge/kenney
          key: kenney-${{ hashFiles('scripts/fetch-kenney.mjs') }}

      - name: Fetch Kenney models (CC0, no-op when cached)
        run: node scripts/fetch-kenney.mjs

      - name: Render chunk ${{ matrix.idx }} (${{ matrix.from }}-${{ matrix.to }})
        run: |
          mkdir -p "$TMPDIR" pieces
          T1=$(date +%s)
          extra=""; [ -n "${{ inputs.concurrency }}" ] && extra="--concurrency=${{ inputs.concurrency }}"
          # identical codec / fps / size / pixel format for every chunk so the pieces join with -c copy
          if [ "$RES" = "1280" ]; then SCALE=0.6666666666666666; props='{"post":{"dpr":0.6666666666666666}}'; else SCALE=1; props='{}'; fi
          set +e
          npx remotion render src/index.ts BridgeShort pieces/piece_${{ matrix.idx }}.mp4 \
            --frames=${{ matrix.from }}-${{ matrix.to }} --gl="$GL" --scale="$SCALE" --props="$props" \
            --codec=h264 --crf=16 --pixel-format=yuv420p --muted --timeout=240000 $extra 2>&1 \
            | tee render.log | stdbuf -oL tr '\r' '\n' | grep --line-buffered -E "Rendered [0-9]*0/|rror"
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" = 0 ] || { tail -c 4000 render.log; exit "$rc"; }
          T2=$(date +%s)
          n=$(( ${{ matrix.to }} - ${{ matrix.from }} + 1 ))
          printf '{"idx":"%s","from":%d,"to":%d,"setup_s":%d,"render_s":%d,"fps":%s,"cache_hit":"%s"}\n' \
            ${{ matrix.idx }} ${{ matrix.from }} ${{ matrix.to }} $((T1 - T0)) $((T2 - T1)) \
            "$(echo "scale=3; $n / ($T2 - $T1)" | bc)" "${{ steps.nm.outputs.cache-hit }}" | tee pieces/piece_${{ matrix.idx }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: piece-${{ matrix.idx }}
          path: pieces/
          retention-days: 7

  join:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMPDIR: ${{ github.workspace }}/../remotion-tmp
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules + Remotion browser
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci && npx remotion browser ensure

      - name: Cache Kenney models
        uses: actions/cache@v4
        with:
          path: public/bridge/kenney
          key: kenney-${{ hashFiles('scripts/fetch-kenney.mjs') }}

      - run: node scripts/fetch-kenney.mjs

      - uses: actions/download-artifact@v4
        with:
          pattern: piece-*
          path: pieces
          merge-multiple: true

      - name: Join losslessly and check the seams
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          ls -la pieces
          ls pieces/piece_*.mp4 | sort | sed "s|^|file '$PWD/|; s|$|'|" > list.txt
          cat list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy -movflags +faststart joined.mp4
          total=${{ inputs.frames_total }}
          frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 joined.mp4)
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 joined.mp4)
          want=$(echo "scale=3; $total / 30" | bc)
          echo "frames=$frames (want $total), duration=${dur}s (want ${want}s)" | tee check.txt
          [ "$frames" = "$total" ] || { echo "FRAME COUNT MISMATCH"; exit 1; }
          python3 -c "import sys; d,w=float('$dur'),float('$want'); sys.exit(0 if abs(d-w) < 0.05 else 1)" || { echo "DURATION MISMATCH"; exit 1; }
          # decode the whole joined file: any broken join shows up as decoder errors
          ffmpeg -v error -i joined.mp4 -f null - 2> decode_errors.txt; echo "decode errors: $(wc -l < decode_errors.txt)" | tee -a check.txt

      - name: Compare boundary frames with frames rendered in one run
        run: |
          mkdir -p "$TMPDIR" seams
          # boundaries = first frame of every piece except the first; take the frame before and the frame at each
          list=$(cat pieces/piece_*.json | python3 -c "import sys,json; r=[json.loads(l) for l in sys.stdin]; print(','.join(str(f) for x in r if x['from']>0 for f in (x['from']-1, x['from'])))")
          echo "boundary frames: $list"
          if [ "$RES" = "1280" ]; then SCALE=0.6666666666666666; props='{"post":{"dpr":0.6666666666666666}}'; else SCALE=1; props='{}'; fi
          REMOTION_TMP="$TMPDIR" STILL_FORMAT=png INPUT_PROPS="$props" node scripts/bridge-stills.mjs seams/ref_ "$list" "$SCALE" 2>&1 | grep -E "^(bundle|still)|rror" || true
          for f in ${list//,/ }; do
            ffmpeg -v error -y -i joined.mp4 -vf "select=eq(n\,$f)" -vsync 0 -frames:v 1 seams/joined_$f.png
            psnr=$(ffmpeg -i seams/joined_$f.png -i seams/ref_$f.png -lavfi psnr -f null - 2>&1 | grep -oE "average:[0-9.inf]+" | cut -d: -f2)
            echo "frame $f psnr_vs_single_run=${psnr} dB" | tee -a check.txt
          done

      - name: Timing summary
        if: always()
        run: |
          started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          now=$(date -u +%s); t0=$(date -u -d "$started" +%s)
          echo "total wall (run start -> join end): $(( now - t0 ))s = $(( (now - t0) / 60 )) min" | tee -a check.txt
          cat pieces/piece_*.json | python3 -c "
          import sys, json
          r = [json.loads(l) for l in sys.stdin]
          for x in r: print(x)
          print('slowest chunk render: %ds; setup s min/max: %d/%d; mean chunk fps: %.3f' % (max(x['render_s'] for x in r), min(x['setup_s'] for x in r), max(x['setup_s'] for x in r), sum(x['fps'] for x in r)/len(r)))
          " | tee -a check.txt
          { echo '### spike-split'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joined-${{ github.run_id }}
          path: |
            joined.mp4
            check.txt
            seams/
          retention-days: 7
