# Daily queue health check (tools/status.py). Raises one GitHub issue per problem, updates it while it lasts and closes
# it when the condition clears (you get an email when one opens):
#   "Orange Juice: queue low"      fewer than 2 days of videos queued
#   "Orange Juice: writer silent"  no accepted writer branch on main for 36 hours
#   "Orange Juice: videos held"    a video failed the render checks twice or more
# 01:00 UTC = 09:00 Manila. Runs no video code: only the repo's own Python from main.
name: queue-report

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: oj-queue-report
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read            # read the queue release and the git history
      issues: write             # open, update and close the alert issues
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # the full history, to find the newest "Accept claude/oj-..." commit
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Queue status and alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/status.py --alert
