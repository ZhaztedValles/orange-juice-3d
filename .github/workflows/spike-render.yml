name: spike-render

# Milestone 1 speed spike: render a frame range of the bridge template (oj-000-bridge) on a CPU-only ubuntu runner and time it.
on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Frame range (Remotion --frames)"
        default: "0-299"
        required: true
      gl:
        description: "Chromium GL backend: swangle | angle | swiftshader | egl | vulkan"
        default: "swangle"
        required: true
      res:
        description: "Output height: 1920 (1080x1920) or 1280 (720x1280; also lowers the WebGL buffer via post.dpr)"
        default: "1920"
        required: true
      concurrency:
        description: "Remotion --concurrency (empty = Remotion default)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GL: ${{ inputs.gl }}
      FRAMES: ${{ inputs.frames }}
      RES: ${{ inputs.res }}
      CONC: ${{ inputs.concurrency }}
      TMPDIR: ${{ github.workspace }}/../remotion-tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Runner info
        run: |
          nproc; free -h; df -h .; node -v; npm -v
          mkdir -p "$TMPDIR"

      - run: npm ci

      - name: Chrome headless shell and its libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev             libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 > /dev/null
          npx remotion browser ensure

      - name: Restore Kenney models
        id: kenney
        uses: actions/cache@v4
        with:
          path: public/kenney
          key: kenney-${{ hashFiles('scripts/fetch-kenney.mjs') }}

      - name: Fetch Kenney models (CC0)
        run: node scripts/fetch-kenney.mjs

      - run: npx tsc --noEmit

      - name: Render frames
        id: render
        run: |
          first=${FRAMES%-*}; last=${FRAMES#*-}; n=$((last - first + 1))
          extra=""; [ -n "$CONC" ] && extra="--concurrency=$CONC"
          # --scale alone does not shrink the WebGL buffer (R3F clamps dpr >= 1), so 720p also passes post.dpr.
          # The scale must make 1080*s and 1920*s exact integers in floating point, hence 2/3 written out.
          if [ "$RES" = "1280" ]; then SCALE=0.6666666666666666; props='{"post":{"dpr":0.6666666666666666}}'; else SCALE=1; props='{}'; fi
          start=$(date +%s.%N)
          set +e
          npx remotion render src/index.ts oj-000-bridge out/spike/segment.mp4 \
            --frames="$FRAMES" --gl="$GL" --scale="$SCALE" --props="$props" --codec=h264 --crf=16 \
            --timeout=240000 $extra --log=verbose 2>&1 | tee render.log | stdbuf -oL tr '\r' '\n' | grep --line-buffered -E "Rendered [0-9]*0/|rror"
          rc=${PIPESTATUS[0]}
          set -e
          end=$(date +%s.%N)
          tr '\r' '\n' < render.log | grep -vE "colormap|^\s*$" | grep -iE "Rendered [0-9]*0/|Encoded [0-9]+/[0-9]+$|error|concurrency|gl|renderer" | tail -n 80 || true
          if [ "$rc" != 0 ]; then tr '\r' '\n' < render.log | tail -n 60; echo "render failed rc=$rc"; exit "$rc"; fi
          wall=$(echo "$end - $start" | bc)
          fps=$(echo "scale=3; $n / $wall" | bc)
          min65=$(echo "scale=1; 1950 / $fps / 60" | bc)
          echo "frames=$n wall=${wall}s fps=$fps est_65s_minutes=$min65" | tee timing.txt
          echo "### spike-render: gl=$GL res=$RES frames=$FRAMES conc=${CONC:-default}" >> "$GITHUB_STEP_SUMMARY"
          echo "frames=$n, wall=${wall}s, **fps=$fps**, est. 65 s video = **${min65} min**" >> "$GITHUB_STEP_SUMMARY"

      - name: Still
        if: always()
        run: |
          mid=$(( (${FRAMES%-*} + ${FRAMES#*-}) / 2 ))
          start=$(date +%s)
          REMOTION_TMP="$TMPDIR" node scripts/stills.mjs out/spike/ci_${GL}_ "$mid,200" 0.5 2>&1 | grep -E "^(bundle|still)|rror" || true
          echo "stills took $(( $(date +%s) - start ))s (incl. bundle)" | tee -a timing.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ inputs.gl }}-${{ inputs.res }}-${{ github.run_id }}
          path: |
            out/spike/
            timing.txt
            render.log
          if-no-files-found: warn
