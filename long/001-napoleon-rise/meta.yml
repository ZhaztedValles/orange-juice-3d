title: "How a Mocked Island Boy Crowned Himself Emperor | The Rise of Napoleon"
description: |
  In 1804 Napoleon Bonaparte took the crown and put it on his own head. Twenty-five years earlier he was a poor boy from Corsica that the other cadets laughed at. This is the story of his rise: Toulon, the whiff of grapeshot, Italy, Egypt, the coup, and the coronation.

